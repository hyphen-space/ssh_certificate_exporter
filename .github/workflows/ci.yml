name: CI/CD

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Format, lint, and typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.13.9"

      - name: Install dependencies
        id: sync
        run: uv sync --locked --dev

      - name: Check formatting
        run: uv run --no-sync ruff format --check .

      - name: Lint
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync ruff check .

      - name: Typecheck
        if: ${{ !cancelled() && steps.sync.outcome == 'success' }}
        run: uv run --no-sync basedpyright

  publish:
    name: Build and publish to GHCR
    needs: checks
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker with the containerd image store
        uses: docker/setup-docker-action@3f1ab1ab0e29231562e4db4ca600c1a49653bac6 # v5.7.0
        with:
          daemon-config: '{"features":{"containerd-snapshotter":true}}'

      - name: Set up ARM64 emulation
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
        with:
          platforms: arm64

      - name: Build and smoke-test multi-platform image
        id: image
        shell: bash
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker buildx build \
            --file Containerfile \
            --platform linux/amd64,linux/arm64 \
            --load \
            --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --tag "$image:$GITHUB_SHA" \
            --tag "$image:latest" \
            .
          for platform in linux/amd64 linux/arm64; do
            docker run --rm --pull=never --platform "$platform" \
              --entrypoint /app/.venv/bin/python "$image:$GITHUB_SHA" \
              -c 'import main, shutil; assert shutil.which("ssh-keyscan")'
          done
          echo "name=$image" >> "$GITHUB_OUTPUT"

      - name: Push image to GHCR
        shell: bash
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          IMAGE: ${{ steps.image.outputs.name }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker push "$IMAGE:$GITHUB_SHA"
          docker push "$IMAGE:latest"
